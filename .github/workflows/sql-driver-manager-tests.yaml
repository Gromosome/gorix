name: SQL Driver Manager Tests

on:
  push:
    paths:
      - "sql-driver-manager/**"
      - "go.work"
      - "go.work.sum"
  pull_request:
    paths:
      - "sql-driver-manager/**"
      - "go.work"
      - "go.work.sum"
  workflow_dispatch:

jobs:
  test:
    name: Run SQL driver manager tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sql-driver-manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            sql-driver-manager/go.mod

      - name: Run tests
        run: go test ./...
