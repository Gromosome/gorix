env: ""
gorix:
  app:
    port: ${GORIX_PORT:-8070}
    prod: false
  databases:
    default:
      driver: postgres
      dsn: postgres://root:root@localhost:5432/root_db?sslmode=disable
      max-open-connections: 25
      max-idle-connections: 10
      connection-max-lifetime: 30m
      connection-max-idle-time: 5m
  documents:
    default:
      driver: mongo
      dsn: "mongodb://localhost:27017/gorix?replicaSet=rs0&directConnection=true"
      database: gorix
      ping-timeout: 5s



